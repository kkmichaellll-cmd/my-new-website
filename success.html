<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signup failed | OpenTour</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #eef1f7;
      color: #191a1d;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .failure-card {
      width: 100%;
      max-width: 560px;
      padding: 48px 32px;
      background: #ffffff;
      border: 1px solid #e0e4eb;
      border-radius: 28px;
      box-shadow: 0 16px 48px rgba(30, 45, 80, 0.06);
      text-align: center;
    }

    .failure-icon {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .failure-icon svg {
      display: block;
      width: 64px;
      height: 64px;
    }

    .failure-card h1 {
      margin: 0;
      font-size: clamp(24px, 5.5vw, 42px);
      font-weight: 800;
      line-height: 1.18;
      letter-spacing: -1px;
    }

    .failure-card h1 span {
      display: block;
    }

    .failure-card h1 span + span {
      margin-top: 8px;
    }

    .retry-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 64px;
      margin-top: 32px;
      padding: 18px 24px;
      border-radius: 18px;
      background: #1952f5;
      color: #ffffff;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.4;
      text-decoration: none;
      box-shadow: 0 16px 32px rgba(25, 82, 245, 0.2);
      transition: background-color 0.2s ease;
    }

    .retry-button:hover {
      background: #1244d9;
    }

    .retry-button:focus-visible {
      outline: 3px solid #1952f5;
      outline-offset: 5px;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .failure-card {
        padding: 36px 20px;
        border-radius: 24px;
      }

      .retry-button {
        min-height: 60px;
        border-radius: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .retry-button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="failure-card" aria-labelledby="failure-title">
    <div class="failure-icon" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none">
        <circle
          cx="32"
          cy="32"
          r="30"
          fill="#FEE2E2"
        />
        <path
          d="M23 23L41 41M41 23L23 41"
          stroke="#DC2626"
          stroke-width="5"
          stroke-linecap="round"
        />
      </svg>
    </div>

    <h1 id="failure-title">
      <span>Signup failed</span>
    </h1>

    <!-- Replace # with your preferred URL -->
    <a class="retry-button" href="https://opendoor.com/login">Try again</a>
  </main>
</body>
</html>
