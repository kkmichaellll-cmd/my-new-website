<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account created | OpenTour</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: #eef1f7;
      color: #171719;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .success-card {
      width: 100%;
      max-width: 560px;
      padding: 40px 28px;
      background: #ffffff;
      border: 1px solid #e0e3e9;
      border-radius: 32px;
      box-shadow: 0 20px 60px rgba(30, 45, 80, 0.08);
      text-align: center;
    }

    .success-icon {
      display: grid;
      place-items: center;
      width: 96px;
      height: 96px;
      margin: 0 auto 32px;
      border-radius: 28px;
      background: #edf1ff;
      transform: rotate(-3deg);
    }

    .success-icon svg {
      display: block;
      width: 72px;
      height: 72px;
      transform: rotate(3deg);
    }

    .success-card h1 {
      margin: 0;
      font-size: clamp(32px, 7.8vw, 52px);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -1.8px;
    }

    .success-description {
      max-width: 460px;
      margin: 26px auto 0;
      color: #727278;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.65;
    }

    .continue-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 72px;
      margin-top: 36px;
      padding: 20px 24px;
      border-radius: 20px;
      background: #1952f5;
      color: #ffffff;
      font-size: 20px;
      font-weight: 400;
      line-height: 1.4;
      text-decoration: none;
      box-shadow: 0 12px 26px rgba(25, 82, 245, 0.18);
      transition: background-color 0.2s ease;
    }

    .continue-button:hover {
      background: #1244d9;
    }

    .continue-button:focus-visible {
      outline: 3px solid #1952f5;
      outline-offset: 5px;
    }

    .continue-button svg {
      width: 19px;
      height: 19px;
      flex-shrink: 0;
    }

    @media (max-width: 480px) {
      .success-card {
        padding: 36px 22px;
        border-radius: 28px;
      }

      .success-icon {
        width: 84px;
        height: 84px;
        border-radius: 25px;
        margin-bottom: 28px;
      }

      .success-icon svg {
        width: 64px;
        height: 64px;
      }

      .success-card h1 {
        letter-spacing: -1.3px;
      }

      .success-description {
        font-size: 14px;
        margin-top: 24px;
      }

      .continue-button {
        min-height: 64px;
        margin-top: 30px;
        border-radius: 18px;
        font-size: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .continue-button {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="success-card" aria-labelledby="success-title">

    <div class="success-icon" aria-hidden="true">
      <svg viewBox="0 0 72 72" fill="none">
        <circle
          cx="36"
          cy="36"
          r="29"
          stroke="#1952F5"
          stroke-width="3.5"
        />
        <path
          d="M24 36L33 45L49 25"
          stroke="#1952F5"
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>

    <h1 id="success-title">
      Account created<br>
      successfully.
    </h1>

    <p class="success-description">
      Click the button below to download app.
    </p>

    <!-- Replace this URL with your destination link. -->
    <a
      class="continue-button"
      href="https://links.opendoor.com/5E2_f"
    >
      Download App

      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="M7 17L17 7M7 7H17V17"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </a>

  </main>
</body>
</html>
