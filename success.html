<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration failed | OpenTour</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    .retry-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 24px;
      padding: 14px 28px;
      border-radius: 8px;
      background: #111827;
      color: #ffffff;
      font: inherit;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }

    .retry-button:hover {
      background: #374151;
    }

    .retry-button:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 4px;
    }
  </style>
</head>

<body class="page page-success">
  <main class="success-layout">
    <section class="success-card" aria-labelledby="failure-title">
      <h1 id="failure-title">Registration failed. Try again</h1>

      <!-- Replace # with your preferred URL -->
      <a class="retry-button" href="https://opendoor.com/login">Try again</a>
    </section>
  </main>
</body>
</html>
